<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#020617" />
		<link rel="icon" type="image/png" sizes="500x500" href="%sveltekit.assets%/favicon.png" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/squareLogo.png" />
		<link rel="manifest" href="%sveltekit.assets%/site.webmanifest" />
		%sveltekit.head%

		<!--
			Hides an already-dismissed promotional banner before it is parsed, so it is never
			painted. It runs here, not on the server, because the server's HTML is cached at the
			edge and shared by every visitor — see "Edge caching" in README.md. The hash of this
			script is pinned in svelte.config.js and rechecked by tests.
		-->
		<script>
			if (/(?:^|;\s*)h2_promo_inventory_2026=dismissed(?:;|$)/.test(document.cookie))
				document.documentElement.setAttribute('data-promo-dismissed', '');
		</script>
	</head>

	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
